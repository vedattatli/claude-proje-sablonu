name: paxdoc-b25-temporary-public-byte-relay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paxdoc_b25_public_capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture exact public official responses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf paxdoc_b25_public_relay
          mkdir -p paxdoc_b25_public_relay/raw paxdoc_b25_public_relay/meta paxdoc_b25_public_relay/headers
          cat > urls.tsv <<'EOF'
          fji_wp_exempt	https://www.immigration.gov.fj/wp-json/wp/v2/pages?slug=visa-exempted-countries
          fji_wp_entering	https://www.immigration.gov.fj/wp-json/wp/v2/pages?slug=entering-fiji
          fji_wp_visit	https://www.immigration.gov.fj/wp-json/wp/v2/pages?slug=visit-fiji
          gabon_diplomatie_visas	https://diplomatie.gouv.ga/9-services-aux-usagers/523-visas/523-formalites-d-entree-au-gabon/
          ghana_visa_africans_2025	https://mfa.gov.gh/index.php/ghana-grants-visa-free-travel-to-african-passport-holders/
          EOF
          while IFS=$'\t' read -r id url; do
            [ -n "$id" ] || continue
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            set +e
            metrics=$(curl --silent --show-error --location --max-redirs 10 --connect-timeout 20 --max-time 180 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --user-agent 'PaxDocResearch/1.0 (+official-rule-verification)' \
              -H 'Accept: text/html,application/json,application/pdf,*/*' \
              -H 'Accept-Language: en,fr;q=0.9' \
              -H 'Cache-Control: no-cache' \
              -H 'Accept-Encoding: identity' \
              -D "paxdoc_b25_public_relay/headers/${id}.headers.raw" \
              -o "paxdoc_b25_public_relay/raw/${id}.bin" \
              -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}\t%{time_total}\t%{num_redirects}' \
              "$url")
            rc=$?
            set -e
            captured=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            http=$(printf '%s' "$metrics" | cut -f1)
            final=$(printf '%s' "$metrics" | cut -f2)
            ctype=$(printf '%s' "$metrics" | cut -f3)
            size=$(printf '%s' "$metrics" | cut -f4)
            elapsed=$(printf '%s' "$metrics" | cut -f5)
            redirects=$(printf '%s' "$metrics" | cut -f6)
            [ -f "paxdoc_b25_public_relay/raw/${id}.bin" ] || : > "paxdoc_b25_public_relay/raw/${id}.bin"
            sha=$(sha256sum "paxdoc_b25_public_relay/raw/${id}.bin" | awk '{print $1}')
            python - "$id" "$url" "$final" "$http" "$ctype" "$size" "$elapsed" "$redirects" "$rc" "$started" "$captured" "$sha" <<'PY'
          import json,sys,pathlib
          keys=['id','requested_url','effective_url','http_status','content_type','byte_size','elapsed_seconds','redirect_count','curl_exit_code','started_at_utc','captured_at_utc','sha256']
          d=dict(zip(keys,sys.argv[1:]))
          for k in ('http_status','byte_size','redirect_count','curl_exit_code'):
              try:d[k]=int(float(d[k] or 0))
              except:d[k]=0
          try:d['elapsed_seconds']=float(d['elapsed_seconds'] or 0)
          except:d['elapsed_seconds']=0.0
          pathlib.Path(f"paxdoc_b25_public_relay/meta/{d['id']}.meta.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY
            awk 'BEGIN{IGNORECASE=1} !/^(set-cookie|cookie|authorization|proxy-authorization|x-csrf-token):/' \
              "paxdoc_b25_public_relay/headers/${id}.headers.raw" > "paxdoc_b25_public_relay/headers/${id}.headers.txt"
            rm -f "paxdoc_b25_public_relay/headers/${id}.headers.raw"
          done < urls.tsv

          python - <<'PY'
          import json,pathlib
          rows=[]
          for p in sorted(pathlib.Path('paxdoc_b25_public_relay/meta').glob('*.json')):
              rows.append(json.loads(p.read_text()))
          pathlib.Path('paxdoc_b25_public_relay/index.json').write_text(json.dumps({'captures':rows},ensure_ascii=False,indent=2)+"\n")
          assert len(rows)==5, rows
          assert all(r['curl_exit_code']==0 and r['http_status']==200 and r['byte_size']>0 for r in rows), rows
          PY
          (cd paxdoc_b25_public_relay && sha256sum raw/* meta/* headers/* index.json > SHA256SUMS.txt)
          (cd paxdoc_b25_public_relay && sha256sum -c SHA256SUMS.txt)

      - name: Commit temporary relay bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'paxdoc-byte-relay'
          git config user.email 'actions@users.noreply.github.com'
          git add paxdoc_b25_public_relay
          git commit -m 'Add temporary B25 public official response bytes [skip ci]'
          git push
