name: paxdoc-b25-temporary-relay-cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paxdoc_b25_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary relay and workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'paxdoc-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -rf --ignore-unmatch paxdoc_b25_public_relay
          git rm -f --ignore-unmatch .github/workflows/paxdoc_b25_public_capture.yml
          git rm -f --ignore-unmatch .github/workflows/paxdoc_b25_cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove temporary B25 public relay and workflows [skip ci]'
          git push
