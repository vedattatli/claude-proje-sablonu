# Proje yapilandirmasi — hook'lar bu dosyayi okur.
# Klasor adlarini kendi projene gore degistir; hook'lar geri kalanini halleder.
# Bir dosya/klasor yoksa ilgili bolum sessizce atlanir — hicbir sey kirilmaz.

# Oturum devir dosyalarinin klasoru
DEVIR_DIZINI="05_OTURUM_DEVIR"

# Karar gunlugu (ADR — Architecture Decision Record)
KARAR_DOSYASI="03_KARAR_GUNLUGU.md"

# Tartismaya kapali kurallar
KURALLAR_DOSYASI="01_KIRMIZI_CIZGILER.md"

# Acik sorular
SORULAR_DOSYASI="02_ACIK_SORULAR.md"

# Yapilacaklar / durum raporu (opsiyonel)
RAPOR_DOSYASI="04_FIZIBILITE/00_FIZIBILITE_RAPORU.md"

# Kac commit'ten sonra devir dosyasi istensin
DEVIR_ESIGI=3

# Otomatik commit acik mi (0 = kapali)
OTO_COMMIT=1

# Otomatik push acik mi (0 = kapali; remote yoksa zaten atlanir)
OTO_PUSH=1
